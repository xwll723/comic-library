name: 抓取更新

on:
  schedule:
    # 每天 UTC 22:00（北京时间 6:00）
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    paths:
      - 'books.txt' # 改书单立刻跑一次

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 取得仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          printf 'token 长度: %s\n' "${#HF_TOKEN}"
          printf 'token 前缀: %s\n' "${HF_TOKEN:0:4}"
          case "$HF_TOKEN" in
            "") echo "!! token 是空的" ;;
            hf_*) echo "格式正确" ;;
            *) echo "!! 不是 hf_ 开头，粘贴内容有问题" ;;
          esac

      - name: 安装上传依赖
        run: pip install --quiet huggingface_hub

      - name: 迁移旧路径（一次性，幂等）
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: xwll/comic-library
        run: python3 migrate_hf.py

      - name: 抓取新章节
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: xwll/comic-library
          # 首次抓新书：0 = 不限（一次抓完）；日常更新每次最多几章
          FIRST_LIMIT: '0'
          DAILY_LIMIT: '5'
        run: |
          node crawl.js --upload

      - name: 生成 OPDS
        env:
          HF_REPO: xwll/comic-library
        run: node opds.js

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有更新"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "已提交"
          fi

      - name: 防止 60 天无活动被停用
        if: always()
        run: |
          mkdir -p .heartbeat
          date -u '+%Y-%m-%d %H:%M UTC' > .heartbeat/last-run.txt
          git add .heartbeat
          if ! git diff --staged --quiet; then
            git commit -m "心跳 $(date -u '+%Y-%m-%d')"
            git push || true
          fi
