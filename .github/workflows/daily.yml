name: 抓取更新

on:
  schedule:
    # 每天 UTC 22:00（北京时间 6:00）
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    paths:
      - 'books.txt' # 改书单立刻跑一次

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 取得仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "token 长度: ${#HF_TOKEN}"
          echo "开头 4 位: ${HF_TOKEN:0:4}"
          python3 - <<'EOF'
import os, sys
t = os.environ.get('HF_TOKEN', '')
bad = []
if not t: bad.append('为空')
if t != t.strip(): bad.append('两端有空白字符')
if ' ' in t or '\n' in t: bad.append('中间含空格/换行')
if not t.startswith('hf_'): bad.append('不是 hf_ 开头')
print('异常:', bad if bad else '无')
EOF

      - name: 安装上传依赖
        run: pip install --quiet huggingface_hub

      - name: 抓取新章节
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: xwll/comic-library
          # 每本书每次最多抓几章，避免一次跑太久（0 = 不限）
          CRAWL_LIMIT: '5'
        run: |
          if [ "$CRAWL_LIMIT" = "0" ]; then
            node crawl.js
          else
            node crawl.js --limit "$CRAWL_LIMIT" --upload
          fi

      - name: 生成 OPDS
        env:
          HF_REPO: xwll/comic-library
        run: node opds.js

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有更新"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "已提交"
          fi

      - name: 防止 60 天无活动被停用
        if: always()
        run: |
          mkdir -p .heartbeat
          date -u '+%Y-%m-%d %H:%M UTC' > .heartbeat/last-run.txt
          git add .heartbeat
          if ! git diff --staged --quiet; then
            git commit -m "心跳 $(date -u '+%Y-%m-%d')"
            git push || true
          fi
